id: c_low_base_growth
name: "低基期成長"
description: "月營收成長 + 股價自高檔回落但法人布局中的中線標的"
holding_period: "1-3 months"
market: "上市/上櫃"

filters:
  - item: "累計月營收年增減率(%)"
    min: 10

rules:
  - "法人買賣||外資連買 – 日@@外資連續買超@@外資連續買超 – 日"

display_sheet: "交易狀況"
display_period: "日"

post_filter_sort:
  - field: "漲跌幅"
    order: "desc"
  - field: "成交張數"
    order: "desc"

# 距 3 個月內最高價 -20% 以下（本地過濾，需 stock_day_*.parquet 歷史）
# Goodinfo FL_ITEM 中暫無等效項目，故走本地 post_filter；
# months=3 平衡時間 vs 訊號：3 個月高點足以代表「近期回檔」，
# 每檔約 3-4 秒抓滿，C3 候選 30-100 檔 → 首次 2-7 分鐘。
# 之後過去月份永久快取，每週只多抓當月。
post_filter:
  - field: "pct_from_52w_high"
    months: 3
    max: -20.0
