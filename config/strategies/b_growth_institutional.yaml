id: b_growth_institutional
name: "成長主力"
description: "EPS 與營收雙引擎成長 + 外資布局中的主力中線股"
holding_period: "1-3 months"
market: "上市/上櫃"

# 經典三角第二角：基本面 + 籌碼（中線主力）
# - 月累計營收 YoY ≥ 15%：營收動能
# - 最新季稅後純益年增率 ≥ 20%：實質獲利成長（取代舊版「投信連買」過嚴條件，
#   投信連買 + 外資連買 雙條件每週撈 < 10 檔，太少；EPS 條件能挑出真正成長股）
# - 外資連買：籌碼確認
filters:
  - item: "累計月營收年增減率(%)"
    min: 15
  - item: "最新季稅後純益年增率(%)"
    min: 20

rules:
  - "法人買賣||外資連買 – 日@@外資連續買超@@外資連續買超 – 日"

display_sheet: "交易狀況"
display_period: "日"

post_filter_sort:
  - field: "漲跌幅"
    order: "desc"
  - field: "成交張數"
    order: "desc"
