id: g_growth_pullback
name: "成長拉回"
description: "市值≥100億 + 月營收YoY≥20% + 連2季淨利成長（基本面同 E，拉回 timing 在分析層）"
holding_period: "1-3 months"
market: "上市/上櫃"

# E 的孿生策略：抓「長多短空、回踩季線」的優質成長股
# - 基本面 filter 與 E 完全相同（市值/營收 YoY/連 2 季淨利），刻意只出「成長宇宙」
# - 故意「不放」E 的均線多頭排列 rule：均線一拉回就斷的票才是 G 要救的對象
# - 拉回 setup（季線上揚 + 乖離帶 −5%~+10% + 量縮）在分析層（grouping.py）用
#   已快取的收盤價 / 量比計算，不依賴 Goodinfo 是否支援乖離/量縮，零新增資料來源
filters:
  - item: "市值 (億元)"                    # ✅ L1 已驗證（半形空格 + 億元）
    min: 100
  - item: "累計月營收年增減率(%)"          # ✅ L1 已驗證（B/E 用過）
    min: 20
  - item: "連續增加季數–單季稅後淨利"      # ✅ L1 已驗證（B/E 用過；EN DASH U+2013）
    min: 2

rules: []  # 不放技術 rule：拉回 timing 由分析層 MA60 斜率 + 乖離帶 + 量比 過濾

display_sheet: "交易狀況"
display_period: "日"

post_filter_sort:
  - field: "漲跌幅"
    order: "desc"
  - field: "成交張數"
    order: "desc"
