id: c_quality_value
name: "品質價值"
description: "頂尖 ROE + 長年連續配息 + 高殖利率的長線品質股（防守 / 壓艙石）"
holding_period: "6+ months"
market: "上市/上櫃"

# 經典三角第三角：品質防守（長線壓艙石）
# 全面提高門檻版本，鎖定「頂尖品質職業個股」：
# - 近四季 ROE ≥ 20%：頂尖品質（巴菲特買進級別的高標）
#   FL_ITEM 名稱使用 EN DASH「–」(U+2013)，從 Goodinfo URL 實測校正
# - 連續配發現金股利 ≥ 10 年：跨完整景氣循環 + 金融海嘯 / 疫情 / 升息壓力測試
# - 成交價現金殖利率 ≥ 4%：價值屬性核心（取代 PB 缺口），確保不在估值高點
# - 不設技術 rule：品質股不擇時，分批佈局即可
filters:
  - item: "近四季–ROE(%)–本季度"
    min: 20
  - item: "連續配發現金股利次數"
    min: 10
  - item: "成交價現金殖利率 (%)"
    min: 4

rules: []

display_sheet: "交易狀況"
display_period: "日"

post_filter_sort:
  - field: "漲跌幅"
    order: "desc"
  - field: "成交張數"
    order: "desc"
