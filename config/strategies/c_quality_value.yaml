id: c_quality_value
name: "品質價值"
description: "高 ROE + 連續配息的長線品質股（防守 / 壓艙石）"
holding_period: "6+ months"
market: "上市/上櫃"

# 經典三角第三角：品質防守（長線壓艙石）
# - 近 4 季 ROE ≥ 15%：高品質公司（巴菲特標準的低標）
#   FL_ITEM 名稱「近四季-ROE(%)-本季度」為推測（圖 2 顯示有此 UI 選項，但 dash
#   字元與內部 FL_ITEM 對應待 Goodinfo URL 實測校正）
# - 連續配發現金股利 ≥ 5 年：穩定獲利的證明，過濾掉一次性配息股
# - Goodinfo 沒有「股價淨值比」filter（只有「每股淨值創新高/低」rule），所以
#   PB 條件拿掉；ROE + 連續配息已能描述「品質」屬性
# - 不設技術 rule：品質股不擇時，何時進場都能慢慢累積部位
filters:
  - item: "近四季-ROE(%)-本季度"
    min: 15
  - item: "連續配發現金股利次數"
    min: 5

rules: []

display_sheet: "交易狀況"
display_period: "日"

post_filter_sort:
  - field: "漲跌幅"
    order: "desc"
  - field: "成交張數"
    order: "desc"
