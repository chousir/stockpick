id: c_quality_value
name: "品質價值"
description: "高 ROE + 長年連續配息 + 殖利率合理的長線品質股（防守 / 壓艙石）"
holding_period: "6+ months"
market: "上市/上櫃"

# 經典三角第三角：品質防守（長線壓艙石）
# 三個條件互補，避免重複勾選同一面向：
# - 近四季 ROE ≥ 15%：高品質公司（巴菲特標準的低標）
#   FL_ITEM 名稱使用 EN DASH「–」(U+2013)，從 Goodinfo URL 實測校正
# - 連續配發現金股利 ≥ 8 年：跨越完整景氣循環，過濾一次性配息股
# - 成交價現金殖利率 ≥ 3%：價值屬性核心（取代 PB 缺口），確保不在估值高點
# - Goodinfo 沒有「股價淨值比」filter（圖 3 確認只有「每股淨值創新高/低」rule）
# - 不設技術 rule：品質股不擇時，分批佈局即可
filters:
  - item: "近四季–ROE(%)–本季度"
    min: 15
  - item: "連續配發現金股利次數"
    min: 8
  - item: "成交價現金殖利率 (%)"
    min: 3

rules: []

display_sheet: "交易狀況"
display_period: "日"

post_filter_sort:
  - field: "漲跌幅"
    order: "desc"
  - field: "成交張數"
    order: "desc"
