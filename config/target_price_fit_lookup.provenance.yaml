# docs/31 §20.13 Phase 2：凍結分位查表 provenance
#
# target_price_fit_lookup.csv 是 Phase 1 校準回測（backtest target-price-read，2026-09-01）
# 的 fit 分位查表，一次性複製凍結進 config/（原始產物在 gitignored research/target_price/）。
# Phase 2 runner (backtest target-price-project) 讀這份、不每次重算——pre-registration 精神：
# fit 窗與 cell 切點都事前鎖定，fit 產物本身也應凍結。
#
# runner 啟動時以 _assert_edges_match 比對 cell label 內嵌的切點 vs 現行 settings，
# 不符則拒跑（或降級為只報 _pooled 區間）——落實「跑完不得回調」。

source: research/target_price/fit_lookup_20260901.csv
frozen_at: 2026-09-06
phase1_run_date: 2026-09-01

fit_window:
  nominal: "2022-01-01 ~ 2024-12-31"
  post_embargo: "2022-01-03 ~ 2024-06-28"   # 尾端剪掉 EMBARGO_TD = max(horizons)+5 = 125 交易日
  n_fit_rows: 539024

cell_edges:                # 事前鎖定；與 config/settings.yaml backtest.target_price 一致
  pos_edges: [-8.0, 8.0]   # ma60_dist_pct：位階貼低 / 中段 / 延伸
  rs_edges: [-5.0, 5.0]    # rs_subind pp：族群內落後 / 均勢 / 領先

horizons_td: [20, 60, 120]  # 但 Phase 2 只用 r+20（唯一裁決-eligible，§20.13）

# 每 cell 的 fit 樣本列數（r+20；n_dates 皆 ~602，惟「貼低×領先」格 n=2024/n_dates=293 偏薄）
cell_n_r20:
  "位階貼低≤-8｜族群內落後≤-5": 47308
  "位階貼低≤-8｜族群內均勢-5~5": 29213
  "位階貼低≤-8｜族群內領先>5": 2024
  "位階中段-8~8｜族群內落後≤-5": 95659
  "位階中段-8~8｜族群內均勢-5~5": 225654
  "位階中段-8~8｜族群內領先>5": 41634
  "位階延伸>8｜族群內落後≤-5": 6504
  "位階延伸>8｜族群內均勢-5~5": 27412
  "位階延伸>8｜族群內領先>5": 63616
  "_pooled": 539024

# runner 據此把機械腿 tier 封頂「低」（confidence_tier 對這些大 cell 會回「中」或「高」，
# 與 Phase 1 主裁決矛盾）。Phase 1 主裁決（§20.13）：
#   #1(b) r+20 pooled-null 配對差 mean −0.04pp、CI [−0.10, +0.03] 跨 0
#     ⇒ 用 cell 的 P50 取代全市場 P50 沒有 measurably 縮小 per-stock 投射誤差
#   #3 r+20 中位偏誤 +2.23pp（test 窗 2025–2026 報酬系統性高於 fit 分布 P50 ⇒ 數字偏低）
#   #4 r+20 區間寬 median (P75−P25) +9.86pp
# 正式重跑門檻（翻正才解除封頂）：每季重跑，r+20 #1(b) CI 整段 <0 且 #1(a) rho≥0.5。
