paths:
  data_dir: data
  cache_dir: data/cache
  raw_dir: data/raw
  reports_dir: reports
  logs_dir: logs
  watchlist_dir: watchlist
  strategies_dir: config/strategies

# 快取保留窗（規劃書 01 P2）。`tw-screener data prune-cache` 依此刪除超窗的本地快取檔。
# 各窗 = 對應分析最大讀取窗（rotation history_days=250 / calibration ~250d）+ buffer；
# 預設 400 日（≈1.6 年），保守不誤砍 calibration 用的歷史。**不自動跑**——由使用者手動或排程呼叫。
cache:
  retention:
    daily_days: 400          # 全市場日線：daily_/daily_all_/otc_daily_
    institutional_days: 1700 # 三大法人：institutional_/institutional_otc_（W28 二輪回補到 2022-01，窗必須蓋住回補資產）
    margin_days: 1700        # 融資融券：margin_/margin_otc_（同上；≈2022-01 起 ~1653 日）
    valuation_days: 400      # 估值比：valuation_ratios_
    stock_day_keep_all: true # 個股月檔（stock_day_<sid>_）小、與候選回補相關，預設全留

goodinfo:
  base_url: "https://goodinfo.tw/tw"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  request_interval_sec: 3
  request_interval_jitter_sec: 1
  cache_refresh_hour: 15   # 盤後資料穩定時點；同一交易日重複跑讀快取，跨交易日才重抓
  max_retries: 3
  backoff_base: 5
  referer: "https://goodinfo.tw/tw/index.asp"
  concurrency: 1
  # screen doctor 健康檢查（規劃書 02 D1）：探針策略 + replay/存樣本路徑，皆可換不寫死
  doctor:
    probe_strategy: "config/doctor_probe.yaml"
    replay_fixture: "tests/fixtures/goodinfo/screener_result.html"   # --replay 離線解析此檔驗 parser 沒退化
    save_fixture_path: "tests/fixtures/goodinfo/doctor_probe.html"   # --save-fixture 把 live 探針 HTML 落地供手動刷新

# Yahoo 股市「概念股」主題成分（多標籤主題用）；只抓概念股，電子次產業沿用手標 concepts.yaml
yahoo:
  base_url: "https://tw.stock.yahoo.com"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  request_interval_sec: 3
  request_interval_jitter_sec: 1
  cache_ttl_hours: 24      # 概念股成分鮮少變，同日重跑讀快取
  max_retries: 3
  backoff_base: 5
  concurrency: 1

# candidates_enriched.csv 的 flags 排雷門檻（程式預算，供 ProPicks 快速排雷；皆為「軟警示」非硬刪）
propicks_flags:
  overheated_ma60_pct: 40      # 距季線 > 此% → 過熱（追高風險）
  strong_leader_yoy_pct: 20    # 過熱例外：距季線高但外資投信同向買 + 營收 YoY ≥ 此% → 改標「強勢領頭」（順勢分批，不預設踢核心）
  low_liquidity_amount: 100    # 成交額(百萬) < 此值 → 低流動（大資金滑價）
  high_pe: 50                  # 本益比 > 此值 → 高PE（題材/估值偏貴）
  cross_trade_lots: 5000       # 外資、投信反向且兩者皆 > 此張數 → 土洋對作（絕對門檻）
  cross_trade_rel_pct: 4       # 修法4：弱邊張數須達近 20 日總量此% 才算對作（濾權值股小量反向誤判，如台積電）
  strong_rally_pct: 15         # 5日漲幅 > 此% 且法人淨賣 → 強漲法人賣（假突破警訊）
  # M-WS5a（WS5-①）貼底揭露：距季線 ≤ 此% → base_zone="貼底"（起漲 base 位階，過熱旗標的對稱面）。
  # 純揭露非 gate；金控 base +6% 命中，對齊回檔帶語意（ma60_band_high=10）。docs/20 §WS5-①。
  base_zone_ma60_max_pct: 10.0
  # M-WS5a（WS5-②）sector-wide 旗標降輪動：同旗標在該次產業掛旗佔比 ≥ 此% 且成員 ≥ min → 標
  # sector_flag_note「族群共振」（＝輪動足跡，不當個股排除理由）。金融 W21 土洋對作 8/17 掛旗實例。
  sector_coverage_pct: 60.0
  sector_coverage_min_members: 5   # 次產業候選數 < 此 → 不算覆蓋度（小族群/庫存觀察無意義；獨立門檻——rotation.min_members 已於 W28 降 4，此處維持 5）

themes_build:
  category_labels: ["概念股"]   # 只抓概念股；集團股 / 電子產業不抓
  concept_min_members: 3        # 概念股清單較鬆，保留門檻拉高防雜訊
  min_members: 2                # 次產業（手標）排名保留門檻
  # 只爬/只寫白名單裡的概念股題材（留空＝全部 101 個）；只會抓這幾頁、又快又乾淨。
  # 名稱須與 Yahoo 完全一致；全部可選名單見 docs/02-data-sources.md。自由增刪。
  concept_whitelist:
    - "衛星/低軌衛星"
    - "5G"
    - "AI人工智慧"
    - "雲伺服器"
    - "電動車/油電車"
    - "ADAS"
    - "車聯網"
    - "功率半導體"
    - "矽智財(IP)"
    - "Mini LED"
    - "無線充電"
    - "半導體設備"
    - "機器人/智慧機械"
    - "風力發電/離岸風電"
    - "國防自主"

twse:
  base_url: "https://openapi.twse.com.tw/v1"
  legacy_base_url: "https://www.twse.com.tw"   # 舊站 host（T86 法人/STOCK_DAY 月檔），路徑在程式
  isin_base_url: "https://isin.twse.com.tw"    # ISIN 上櫃清單 host
  user_agent: "tw-stock-screener/0.1"
  request_interval_sec: 1
  cache_ttl_hours: 6

# TDCC 集保戶股權分散表（規劃書 02 D3）：每週公布的大戶持股比。免費 OpenData，無反爬。
# big_holder_pct = Σ(big_holder_levels 股數) ÷ 級距17合計 ×100；占比口徑為占集保庫存（≈流通量）非占股本。
# 級距→張數（1 張＝1000 股）：12=400k–600k 13=600k–800k 14=800k–1M 15=>1M。
#   ≥400 張大戶＝[12,13,14,15]；≥1000 張（千張大戶）＝[15]。門檻可換、不寫死。
tdcc:
  base_url: "https://opendata.tdcc.com.tw"
  endpoint_id: "1-5"               # 集保戶股權分散表
  user_agent: "tw-stock-screener/0.1"
  interval_sec: 1
  cache_ttl_hours: 18              # 週頻資料；同日重跑讀快取，跨日才重抓
  big_holder_levels: [12, 13, 14, 15]   # ≥400 張大戶
  big_holder_1000_levels: [15]          # ≥1000 張（千張大戶）

# TPEX（櫃買中心）：base_url 為所有上櫃端點（OpenAPI/舊版 .php/tradingStock）的 host，
# TWSEClient 讀取生效（M-Rev3）；端點路徑屬 API 契約、留在 twse.py 常數。
# TWSEClient 透過 _load_otc_ids() 自動分派上市/上櫃；TPEX 與 TWSE 共用 throttle。
tpex:
  base_url: "https://www.tpex.org.tw"
  notes: "單位仟股 / 仟元（parser 自動 ×1000 對齊 TWSE）"

report:
  default_top_n: 10
  llm:                            # 規劃書 04 A7：個股報告 LLM 配置（builder 讀取，不寫死）
    model: claude-opus-5          # 深度個股報告品質優先，用當前最新 Opus；省成本可改 claude-sonnet-5
                                  # Anthropic 出新版 Opus 時記得手動升級此值（無自動追新別名）；
                                  # Opus 4.7+ 系列不接受 temperature 參數，故本設定不提供該欄位
    max_tokens: 4000              # 10 段框架＋多空各 3-5 點，避免截斷（原 2500 易截）
  artifact_check:                 # 規劃書 05 F4：make week 尾段產物完整性檢查（缺者 WARNING、不擋流程）
    machine:                      # make week 機器產物——只查最新週，缺＝該步驟無聲失敗
                                  # （cp_candidates.md 曾 W25–W27 連三週斷供無人知，即本清單動機）
      - screen_result_d_quality_leader.csv
      - screen_result_e_growth_momentum.csv
      - screen_result_f_value_rebound.csv
      - screen_result_g_growth_pullback.csv
      - candidates_enriched.csv
      - group_analysis.md
      - sector_rotation.md
      - sector_rotation.csv
      - trend_leaders.csv      # F3 趨勢領頭板（sector rotation 一併產出）
      - theme_strength.csv
      - cp_candidates.md
      - inflection_ambush.md   # M4.2 候選源 E（委託書 M4）：零命中週也會產出，缺檔＝該步驟失敗
    analyst:                      # 分析師產物——往週缺＝斷供 WARNING（W26 型）；最新週缺＝提醒
      - pick.md                   # excluded.csv 不列：當週可能真無旗標剔除，缺檔合法
      - picks.csv

snapshots:                        # WS-J.1 point-in-time 快照：凍結當週 concepts/watchlist/holdings/次產業宇宙成員
  dir: data/snapshots             # 目的地根目錄（data/ 已在 .gitignore）；子目錄依週次 tag（如 2026-W28）

near_flow:                        # 規劃書 05 F5（沿舊 06 NF1）：近端籌碼揭露欄——純揭露非 gate
                                  # （§1.4 實證：近端佔比單獨無判別力，不得當排序主判）
  min_lots: 1000                  # 法人 20 日買超 < 此張數 → 該邊不評（無「前段買很兇」可揭露）
  stall_share_pct: 5              # 近5日佔20日累計 < 此% → 熄火（台新新光金 2% 型）
  accel_share_pct: 40             # ≥ 此% → 加速（均勻分佈≈25%）
  risk_ext_ma60_pct: 15           # risk_kind 價格延伸門檻（對齊 F2 核心位階紀律 +15%）
  risk_down_5d_pct: -5            # risk_kind 價格已跌：5日報酬 < 此% 且破月線

contrarian_base:                  # 規劃書 24 M-BR1：底部左側偵測欄。四個上游欄恆為純揭露、不改剔除/排序；
                                  # 唯一會影響 picks 的是 contrarian_ready（委託書 M1・2026-08-08 裁決 A 人工解禁）。
                                  # 證據狀態（docs/24 §3.1/§6）：「轉買×貼低」**兩條件桶已否證**
                                  # （201 週、2,477 股×週，lift r+20 −2.30%、CI95 [−3.52,−1.26]、
                                  #  walk-forward 1/5 為正）；委託版**三條件桶未測、且先驗不利**。
                                  # 不得寫成「未驗證」。回退＝picks_unblocked: false（一行，不刪碼）。
  min_lots: 1000                  # |法人 20 日淨額| < 此張數 → flow_inflection 不評（量小無可揭露；同 near_flow 口徑）
  stall_share_pct: 5              # 仍在賣但近5日佔20日累計 < 此% → 熄火（賣壓幾乎停）
  accel_ratio: 1.0                # 近5日日均 / 20日日均 > 此倍數 → 加速（買賣方向由近5日淨額正負定）
  at_low_pct: 2.0                 # 距 60 日低 ≤ 此% → 在低
  near_low_pct: 5.0               # 距 60 日低 ≤ 此% → 貼低（左側接刀的結構支撐要件）
  mid_pct: 20.0                   # 距 60 日低 ≤ 此% → 中段；超過 → 高檔
  strong_yoy_pct: 20              # 月營收 YoY ≥ 此且未降速 → 強化（對齊 propicks_flags.strong_leader_yoy_pct）
  weak_yoy_pct: 5                 # YoY 低於此（仍正）→ 減速（低個位數成長，如聯發科 +2.8%）
  decel_deep_pct: -30             # YoY 二階導（本月 YoY − 上月 YoY）深於此 → 大幅降速；連 2 月深負 → 轉差
  thin_margin_pct: 5              # 單季稅後純益率低於此 → 健康分類降一級（毛利高但淨利薄）
  # ── 委託書 M1（裁決 A・人工解禁）：合格左側票進機會層小注 ──────────────────
  picks_unblocked: true           # ⬅ 總開關。false＝contrarian_ready 恆 False、回退純描述 tag
  min_buy_streak_days: 2          # M1.1 防接刀：外資尾端須連 ≥ 此天數買超（單日翻買不算轉買）
  new_low_eps_pct: 0.0            # M1.1 防接刀：距 60 日低須 > 此% 才算「未破新低」
                                  # （low_60d 窗含當日，dist=0 ＝當日收盤就是新低＝仍在破底）
  # 以下三鍵**無程式消費**，是給週報 prompt（M7 patch-1）與人工的單一真相來源，
  # 改門檻時只改這裡、prompt 引述它，避免兩處漂移：
  entry_ladder_pct: [20, 30, 50]  # M1.2 左側階梯 T1 現價／T2 low_60d／T3 深殺保留（前小後大）
  size_ratio_vs_opportunity: 0.5  # M1.3 單筆上限＝一般機會層的 ½（事件閘門封 ⅓ 時再疊乘）
  thesis_prefix: 左側M-BR1        # M1.5 picks 的 thesis 前綴，供 pick_outcome 分層記帳
  # M1.6 自動回收條款（pick_outcome 消費）：達到任一門檻後，若 α 與勝率同時劣於一般機會層
  # → 週報必印「左側解禁回收警告」，回退＝把 picks_unblocked 改 false。
  recall_min_picks: 10            # 左側票累積筆數達此 → 開始判定
  recall_min_weeks: 12            # 或解禁後滿此週數 → 開始判定
  recall_unblocked_since: "2026-08-08"  # 解禁日（週數起算基準）

trajectory:                       # 規劃書 05 F5（沿舊 07 TR1）：回踩品質軌跡欄——啟發式輔助非買賣訊號
  ma_window: 20                   # 站上/跌破月線天數的均線窗
  pullback_vol_window: 5          # 回踩期均量窗（交易日）
  base_vol_window: 20             # 前段均量窗
  calm_vol_ratio: 0.8             # 回踩量比 ≤ 此＝縮量（止穩要件）
  danger_vol_ratio: 1.2           # ≥ 此＝放量下殺（破線要件之一）
  danger_streak: 3                # 連跌 ≥ 此天（破線要件之一）
  min_history_days: 25            # 歷史 < 此 → 軌跡欄 null（上櫃缺口如實）

picks:                            # 規劃書 05 F2 核心層位階紀律（裁決點 #2 拍板 +15%（嚴），2026-07-03）
  core_ext_ma60_max_pct: 15.0     # 核心層距季線乖離上限（%）：超過不得入 core（picks record 硬擋）。
                                  # §1.3 實證分界：>15% 的 8 檔平均 −9.17% vs ≤15% 的 12 檔 +1.19%。
                                  # 試行值——F1 閉環（make pick-outcome）每季隨樣本變厚校準。
                                  # 10/12/15 三檔校準協議見 docs/20 §7（M-WS5c，W28+ 才有資格裁決）。

group_analysis:
  weights:
    momentum: 0.50      # 5 日累計漲幅（sigmoid 校準），動能主導
    entry_rate: 0.25    # 族群入選率
    institutional: 0.15 # 法人買超家數比（族群內 inst_net>0 家數 / 成員數，已啟用）
    size: 0.10          # 族群規模（log 正規化）
  min_group_size: 2
  top_groups: 10
  top_stocks: 10
  dividend_lookahead_days: 14   # 除權息前瞻窗（日曆日，約 10 交易日）
  macro_lookahead_days: 30      # 總經事件前瞻窗（日曆日，涵蓋雙雷／法說／結算）
  vol_lookback_days: 20         # 量比均量視窗（交易日）；每檔只取今日前最近 N 天平均，與輸入列數脫鉤
  radar:                        # 輪動雷達（Section 2.8 領先鏡頭 + Section 6 深度解讀驅動）
    vol_surge_ratio: 1.5        # 量比 ≥ 此值算「量能放大」（領先訊號之一）
    deep_dive_top_n: 6          # Section 6 深度解讀取前 N 強領先次產業
    lead_weights:               # 領先分數權重：外資/量能 breadth 主導、動能僅輔
      foreign: 0.45
      vol_surge: 0.30
      momentum: 0.25
    main_axis:                  # 0.3 本週族群主軸（問題3・M3）：全市場輪動→候選成員數→uncovered 補位
      trend_top_n: 5            # 主軸「趨勢分 top」取前 N 強（價格證據）

# 策略 G（成長拉回）的拉回 setup 門檻；G 有效命中 = 基本面命中 ∧ 三者全中
g_pullback:
  ma60_band_low: -5.0        # 乖離帶下界（% 距季線；允許略破季線）
  ma60_band_high: 10.0       # 乖離帶上界（超過＝仍延伸、不算回踩）
  ma60_slope_window: 10      # 季線斜率比較視窗（交易日）
  ma60_slope_min_pct: 0.0    # 季線上揚最低斜率（%）；> 此值才算上揚
  vol_ratio_max: 1.0         # 量縮門檻（今日量 / 20 日均量 ≤ 此值）

# 次產業資金流向輪動（docs/12-sector-rotation.md）
# R1 為視窗骨架；R2 校準後的起漲點/訊號門檻會寫回此段
rotation:
  short_window: 5            # 短窗（交易日）：momentum / breadth / concentration 的錨（不隨 windows 變）
  long_window: 20            # 長窗（交易日）：breadth / concentration 的長窗錨
  windows: [5, 10, 20]       # 輪動輸出窗：每窗各產 {net,foreign,trust}_flow_{w}d + _z
                             # （short/long 一律為子集）；10d 為分析層補窗加的中端鏡頭，對齊個股法人近端窗 5/10d；
                             # momentum/breadth/concentration 仍錨在 short/long
  history_days: 250          # 載入法人/價量歷史天數（≈ 1 年）
  min_members: 4             # 籃子最小成員數（W28 factor-lab：晶圓代工4檔53週+11.5pp
                             # 制度性榜外＝最大具名機會成本，docs/22 §2；3 檔以下仍擋）
  clip_daily_return_pct: 10.0  # 籃子個股日報酬夾限＝台股漲跌停；防減資/分割未還原假跳動毒化指數
  top_n: 10                  # 報表/CLI 顯示前 N 名
  rank_by: trend_score       # 排名鍵（ΔRank 基準）。F3 改價格趨勢分數（價格證據優先）——
                             # 舊值 net_flow_20d（20 日流量天然落後，§1.5#2）降為確認欄
  trend_score:               # 規劃書 05 F3：價格證據優先的族群趨勢分數（0-100，主排序鍵）
    ma_short: 20             # 籃子指數短均線（月線）
    ma_long: 60              # 籃子指數長均線（季線；成員站上比例亦用此窗）
    rs_window: 20            # 領頭股 RS 視窗（交易日；報酬 − 全市場中位）
    weights:                 # 三成分權重（自動正規化）
      basket_ma: 0.40        # 籃子等權指數 vs 自身月/季線
      member_breadth: 0.35   # 成員站上自身季線比例
      leader_rs: 0.25        # 領頭股 RS 跨次產業百分位
  leaders:                   # 規劃書 05 F3：趨勢領頭板（全市場 RS 前 N；過熱/土洋對作只標註不剔除）
    top_n: 15
    rs_window: 20
    min_amount_million: 100  # 近 20 日均成交額門檻（百萬；同 propicks 低流動線）——妖股不入板
  audit_lookback_days: 20    # sector universe --audit：近 N 日無日線收盤＝無價成員清查視窗
  quadrant:                  # R3 四象限：資金軸＝長窗淨流正負；價格軸＝籃子位階
    position_window: 60      # 位階回看（交易日）
    position_low_pct: 10.0   # 距 60 日低 ≤ 此值＝「未漲」（與 R2 起漲 X=10% 對齊）
    next_precision_low_pct: 5.0  # ⚡貼低精確攔截：流入×未漲中距低 ≤ 此值（2026-07 象限校準：
                             # 起漲攔截 lift ~3.0 vs 10% 門檻 ~2.0，代價觸發減半、領先縮短）；null 停用
    # calib_note：象限可信度校準結論（每季 make rotation-calib 重跑後人工更新；報表 Section 3 印出）
    calib_note: >-
      2026-07 校準（~250 交易日）：流入×已漲前瞻超額最強（+3.6%/20d），流出×已漲前瞻超額仍為正
      （非賣訊），流入×未漲前瞻超額偏弱但對起漲事件有攔截 lift ~2（⚡貼低 ~3）；象限＝狀態切片、
      非多空判詞。統計力有限、每季重跑覆核（詳 research/rotation/）。
  cp_score:                  # A1 連續 CP 補漲分數＝資金 z × 位階剩餘空間 room
    position_ceiling: 60.0   # room = max(0, 1 − 距低% / 此值)；距低 ≥ 此值 → 補漲空間視為 0
  entry_signal:              # ★ R2 校準結果（2026-06-11・資料 2025-05-28~2026-06-10・34 起漲點）
    signal: trust_flow_20d   # 投信 20 日資金流：跨起漲定義（X=10/12%）最穩健的領先訊號
    mode: z                  # 門檻為自身 60 日滾動 z 分數（次產業間規模可比）
    threshold: 1.0
    require_momentum: true   # 且 flow_momentum>0：recall 5-6成・lift 1.2-1.5・領先中位 8-10 日
                             # （R3 籃子修正——clip±10%＋stock_day 補上櫃——後重校準，結論不變）
    lead_window: 15          # 觸發後 15 交易日內起漲算命中（校準同值）
    confirm_signal: flow_breadth_20d   # 確認鏡頭：高精度低 recall（>0.6 時 lift ~1.5）
    confirm_threshold: 0.6
    # 校準紀錄：X=8% 時全訊號 lift→~1.0（訊號不領先弱波動、只領先有意義波段）；
    # 詳 research/rotation/calibration_20260611.md（本地）；每季資料累積後重跑 make rotation-calib
  calibration:               # R2 起漲點回測校準（研究軌 make rotation-calib）
    breakout_x_pct: 10.0     # 起漲定義：N 日內籃子前瞻漲幅 ≥ X%
    breakout_n_days: 15      # 前瞻視窗 N（交易日）
    low_base_m_days: 60      # 低基期回看 M（交易日）
    low_base_tol_pct: 3.0    # 距 M 日低點容忍（%）
    cooldown_days: 15        # 起漲後冷卻（同波段不重複計）
    lead_window: 15          # 訊號領先視窗（此窗內起漲＝命中）
    z_window: 60             # 訊號滾動 z 分數視窗
    z_min_periods: 30        # z 暖機最低樣本
    min_triggers: 8          # 進建議名單最低觸發數
    min_lift: 1.5            # 進建議名單最低 lift（命中率/隨機基率）

cp_value:                    # B2 個股版起漲事件回測（docs/13 Phase B；make cp-value-calib）
  history_days: 250          # 載入上市日線/法人歷史天數（≈ 1 年；個股層只框上市）
  z_window: 60               # panel 個股自身滾動 z 視窗（與 B1 stock_panel 一致）
  z_min_periods: 30          # z 暖機最低樣本
  position_low_pct: 15.0     # 「+low」CP 變體：距 60 日低 ≤ 此值＝價未動（個股波動大於族群）
  early_gate:                # ★ M-MH Phase 2 早偵測閘（改判「早」非「準」；docs/13 Phase D）
    enabled: true            # 開：scan 加 +early/+early+low/+nodiv 變體＋跑跨窗配對領先
    z_threshold: 1.0         # 跨窗配對領先量測＋ +early 閘的資金 z 門檻
    long_z_ceiling: 0.5      # +early：同 prefix 20d-z 仍 < 此值＝長窗尚未追上（舊賣單稀釋態）
    decel_floor: 0.0         # +early：flow_decel ≥ 此值＝短窗買盤未減速（新鮮）
    div_ceiling: 0.0         # +nodiv：price_flow_div_{w}d ≤ 此值＝價未先噴（資金領先價）
    lead_lookback: 30        # 跨窗配對領先：事件前回看 N 交易日找各窗首次 z≥門檻
    min_lead_days: 2         # 過閘：短窗中位領先 20d ≥ 此日數（GATE 核心判準）
  # ── 研究軌旋鈕（windows/labels/門檻網格/robustness/monotonicity/interaction/top_calib）
  #    已移至 config/research/cp_value_calib.yaml（規劃書 04 A2）：cp calibrate 載入合併，
  #    主 make week／生產候選（cp candidates / valuation）不讀。每季重校在該檔調，不污染生產設定。
  early_watch:               # ★ M-MH Phase 3 短窗早訊號加值欄（GATE ❌ 但 short_only ~30% 真覆蓋）
    enabled: false           # 研究中・預設關（規劃書 04 A3）；開＝cp_candidates.md 加「庫存/觀察・20d 未確認」低信心早訊區塊
    prefixes: [foreign_flow, net_flow]  # 早訊掃描的法人別（投信雜訊高、預設不納）
    # z 門檻 / 20d 上限 / 未減速 floor 沿用 cp_value.early_gate（同一定義，不另立）
  overheat_watch:            # ★ 精修・點 5：過熱-退潮警示（停利提醒；**未校準啟發式**，非賣訊）
    enabled: false           # 研究中・預設關（規劃書 04 A3）；開＝cp_candidates.md 加「過熱-退潮警示（庫存/觀察）」區塊
    near_high_pct: 8.0       # 距 60 日高 ≥ −此值＝已漲到區間高位（20d 動能起來）
    div_floor: 0.0           # price_flow_div_5d > 此＝量價背離（價漲、5 日資金未跟）
    vol_contract_floor: 0.0  # volume_z_5d < 此＝量縮（必要：短窗 flow_decel<0 減速）
  candidate:                 # B3 個股 CP 候選清單（生產軌；make cp-value-candidates）
    max_candidates: 25       # **每型態**顯示上限（三型態各自獵場，避免貼低高分淹沒反轉；≤0 不截）
    drawdown_pct: 20.0       # L3 反轉「深跌情境」＝距 60 日高 ≤ −此值（與 B2 reversal 對齊）
    confirm_days: 2          # L3 反轉確認：近 N 個交易日法人合計連續淨買（過濾單日 spike，docs/13 §3）
    rules:                   # ★ B2 校準勝出因子（2026-06-14・research/cp_value/；每季重校可改）
      - name: L1埋伏          # foreign_flow_20d_z(z>0.5)+low≤15：lift 1.69・領先 7 日
        label: ambush
        flow_z_col: foreign_flow_20d_z
        z_threshold: 0.5
        modifier: low        # low=價貼低（≤position_low_pct）；mom=加速中；none=純資金 z
      - name: L2追突破        # trust_flow_20d_z(z>1.0)+low≤15：lift 1.83・領先 7 日
        label: breakout
        flow_z_col: trust_flow_20d_z
        z_threshold: 1.0
        modifier: low
      - name: L3反轉          # trust_flow_20d_z(z>1.5)+mom：lift 1.66・領先 7 日；＋深跌＋確認門檻
        label: reversal
        flow_z_col: trust_flow_20d_z
        z_threshold: 1.5
        modifier: mom
        require_confirm: true
    laggard:                 # ★ M-Part C 生產化：冠軍 S+ 內族群內落後濾鏡（docs/17；C-P2 升級）
      enabled: true          # 開：對 apply_to 型態的落後股 cp_score 輕加權＋揭露 rs_subind 欄
      apply_to: [ambush]     # 加權只作用型態（D2：嚴格對齊 C-P2 證據＝冠軍 S+＝L1 埋伏；L2/L3 只揭露）
      threshold: 0.0         # rs_subind < 此＝落後其次產業（C-P2 驗證切點；個股報酬−次產業籃報酬 pp）
      boost: 0.3             # 命中型態的落後股 cp_score ×(1+boost)＝輕加權浮上（每季隨資料重校）
  valuation:                 # C1 個股相對估值（官方 trailing PE/PB；make cp-value-valuation・docs/13 §C1）
    min_peers: 5             # 次產業同儕有效數下限，低於不計相對位階（樣本太小無代表性）
    cheap_pctile: 30.0       # 次產業升冪百分位 ≤ 此值標「相對便宜」（0=次產業內最便宜；PE 主、PB 補虧損股）
    max_rows: 40             # cp_valuation.md 列出前 N（依百分位遞增）；≤0 不截
    self_history_min_snapshots: 8  # docs/31 §14：自身PE歷史百分位至少要幾筆快照才計算（目前約10週/23筆深度）

backtest:                    # 規劃書 03 V1 策略回測閉環（make backtest-strategies）
  strategies:
    hold_weeks: [2, 4, 8, 12]   # 報全部持有窗看 edge 隨持有衰減（不掃窗挑最好；規劃書 03 §V1）
    history_days: 250            # 載入日線快取的回看交易日數
    trading_days_per_week: 5     # 持有週→交易日換算
    clip_daily_return_pct: 10.0  # 大盤等權指數日報酬夾限（漲跌停外＝未還原事件，夾住防毒化）
    min_sample_warn: 20          # 樣本低於此 → 報表標「僅供方向性、未達顯著」
  picks:                     # 規劃書 05 F1 pick 閉環（make pick-outcome）：picks/excluded 底帳 → 命中率×α×偽陰性
    history_days: 250            # 載入日線快取的回看交易日數
    hold_weeks: [2, 4, 8, 12]   # 固定持有窗（同 V1 全報、不掃窗挑好看）
    trading_days_per_week: 5
    clip_daily_return_pct: 10.0  # 持有窗大盤等權指數日報酬夾限（複用 V1 機制）
    min_sample_warn: 20          # 樣本低於此 → 報表標「僅供方向性、未達顯著」
    min_subind_members: 3        # 次產業同窗有價成員低於此 → 族群超額標 null（樣本太小）
    brief_filename: pick_outcome_brief.md  # WS-A3 上週 r+5 brief 檔名（寫進最新週報目錄）
    # 委託書 M6 excluded 分桶回饋帳的前瞻窗（交易日）。r+5 一窗判不出「剔除是不是錯了」
    # ——裁決 B 的持有週期是 2–6 週，r+20 才貼近實際持有期，故兩窗並列。
    # 每窗都並排同窗 picks 平均當基準（沒有基準的桶平均會在多頭週製造偽陰性錯覺）。
    brief_bucket_horizons_td: [5, 20]
    output_dir: research/pick_outcome
  panel:                     # WS-A2 ground-truth 面板（make build-panel）：因子實驗台資料底盤
    history_days: 1220           # 載入日線快取的回看交易日數（W28 二輪：≈2021-08 起載入，含指標暖身）
    panel_start: "2022-01-01"    # 面板輸出起日（指標算完後裁切；暖身段不輸出）——涵蓋 2022 空頭/2023 復甦/2024-25 多頭
    horizons_td: [5, 10, 20, 40] # 前瞻窗（交易日）；entry=次一交易日、未到期/下市=null
    ma_windows: [20, 60]         # 位階均線窗（ma{w}_dist_pct）
    vol_lookback: 20             # 量比回看窗（窗不足=null，不填 0）
    reconcile_tol_pct: 0.5       # 核價抽查容差%（TWSE 兩端點交叉：STOCK_DAY 修訂 vs daily_all 快照）
    reconcile_pass_rate: 0.995   # 端點一致率低於此＝核價 FAIL（分歧＝快照未含盤後修訂，面板採修訂值）
    reconcile_samples: 10        # 核價抽查檔數
    delisted_list: research/survivorship/delisted_2022.csv  # WS-J.3 官方下市清單（TWSE OpenAPI）；面板標 delisted=true；缺檔→全 False＋報告提示
    output_dir: research/panel
  factor_lab:                # WS-B 統一因子實驗台（make factor-lab）：IC/CI/walk-forward/殘差
    panel_path: research/panel/panel.parquet  # 面板來源（make build-panel 產物）
    n_splits: 4                  # walk-forward 測試段數（expanding、embargo=horizon+1）
    min_train_frac: 0.4          # 首段訓練占比下限
    buckets: 5                   # 橫斷面分位桶數
    inference: block_bootstrap   # WS-I 推論硬化：CI 新預設（週頻/日頻快照×前瞻窗重疊，Fisher-z 偏窄；docs/22 §7.2）
    n_boot: 1000                 # moving-block bootstrap 重抽次數
    seed: 42                     # bootstrap 亂數種子（deterministic，供機器等價/回歸重跑對表）
    output_dir: research/factor_lab
  regime_history:            # WS-H.3 regime 標籤歷史化（make regime-history）：V2 引擎逐日 as-of 重算
    start: "2022-01-01"          # 標籤起日（與 panel_start 對齊）
    output_path: research/panel/regime_labels.parquet  # date×regime 標籤（panel build 自動 join）
  rotation_efficacy:         # WS-C 輪動欄效度（make rotation-efficacy）：重建→對表→IC/lift
    horizons_td: [5, 10, 20]     # forward basket 檢驗窗（交易日）
    n_splits: 3                  # walk-forward 段數（週頻樣本 ~50 週，3 段夠粗）
    min_train_frac: 0.4
    n_boot: 1000                 # lift 表 bootstrap 重抽次數
    output_dir: research/rotation_efficacy
  laggard_grid:              # WS-D 族群內強弱 2×2×位階 forward 報酬格（make laggard-grid）
    horizons_td: [10, 20]        # forward 窗（交易日）
    rs_window: 20                # rs_subind 回看窗（個股 vs 次產業籃報酬差）
    n_boot: 1000
    output_dir: research/laggard_grid
  g3_grid:                  # docs/31 G3 候選 filter 驗證（族群前5×個股貼落後×位階中段×資金非負）
    horizons_td: [10, 20]        # forward 窗（交易日），與 laggard_grid 同窗才可比較
    rs_window: 20                 # rs_subind 回看窗，同 laggard_grid 口徑
    rs_range: [-15.0, 0.0]        # docs/31 G3：rs_subind_20d ∈ [-15,0]
    ma60_range: [-10.0, 10.0]      # 2026-08-22修正：改雙邊區間，單邊≤10會混入破線股（opus複核）
    top_n_groups: 5                # docs/31 G3：族群 trend_score 當日排名前5（次產業，非個股列）
    flow_window: 20                # net_flow_{w}d 累加窗
    flow_z_window: 60              # net_flow_z 滾動 z 視窗（同 stock_panel.py z_window 慣例）
    flow_z_min_periods: 30         # z 暖機最低樣本（同 stock_panel.py 慣例）
    snapshot_gap_td: 5             # 週頻快照間隔（交易日，近似值）→ CI block長度換算用
    n_boot: 1000
    output_dir: research/g3_grid
  l6_g4_watch:               # docs/31 §9 item4：L6/G4 前瞻累積軌每週快照（手動指令，需每週跑）
    l6_yoy_min: 20.0              # docs/31 §5.2：月營收累計YoY≥20
    l6_pe_max: 25.0                # docs/31 §5.2：PE≤25
    l6_mktcap_min_billion: 100.0   # docs/31 §4.2 四條件版：市值≥100億（落難週操作定義沿用）
    trust_flow_window_td: 5        # 投信近5日淨買超視窗（交易日）
    output_path: research/l6_g4_watch/ledger.csv
    distressed_ma60_max_pct: -8.0    # docs/31 §5.2「落難週」：距MA60<此值
    distressed_low60_max_pct: 15.0   # docs/31 §5.2「落難週」：距60日低≤此值
    distressed_ret8w_max_pct: 0.0    # docs/31 §5.2「落難週」：前8週(≈40交易日)報酬<此值
    distress_market_history_days: 130  # 落難週三維計算所需日線窗（60日MA/低點+40日位移+緩衝）
  g1_g2_g5_watch:            # docs/31 §11：G1/G2/G5 前瞻累積軌每週快照（手動指令，需每週跑）
    g1_delta_net_margin_min: 1.5   # docs/31 §4.1 G1：Δnet_margin≥+1.5pp
    g1_ma60_max_pct: 15.0           # docs/31 §4.1 G1：above_ma60_pct≤+15
    g2_roe_min: 3.5                 # docs/31 §4.1 G2：roe_q_pct≥3.5
    g2_debt_max_pct: 60.0           # docs/31 §4.1 G2：debt_ratio_pct≤60
    g2_current_min: 1.2             # docs/31 §4.1 G2：current_ratio≥1.2
    g2_mktcap_min_billion: 300.0    # docs/31 §4.1 G2：market_cap_billion≥300
    g5_val_pctile_max: 40.0         # docs/31 §4.1 G5：val_pctile≤40
    g5_amount_min_million: 300.0    # docs/31 §4.1 G5：amount_million≥300
    ma60_window: 60                 # G1 above_ma60_pct 的MA天數
    market_history_days: 90         # load_market_history回看天數（需≥ma60_window暖身）
    min_peers: 5                    # 同次產業同儕最低樣本數（val_pctile/gross_margin peer用）
    output_path: research/g1_g2_g5_watch/ledger.csv
  official_sector_watch:     # docs/31 §12：官方族群前5前瞻累積軌每週快照（手動指令，需每週跑）
    min_purity: 0.5                # docs/31 §10.10：穩健區間0.4-0.6取中點，非重新調參
    top_n_groups: 5                 # 同§10 top_n，維持可比較
    market_history_days: 90         # load_market_history回看天數（需≥ma_long=60暖身）
    output_path: research/official_sector_watch/ledger.csv
  official_sector_grid:      # docs/31 §10：官方產業分類×MI_INDEX官方指數重測「族群前5」
    horizons_td: [10, 20]        # forward 窗（交易日），與G3同窗才可比較
    top_n_groups: 5               # 族群trend_score當日排名前5（同G3 top_n，維持可比較）
    snapshot_gap_td: 5            # 週頻快照間隔（交易日）→ CI block長度換算用
    n_boot: 1000
    hand_min_purity: 0.7          # docs/31 §10.6：手標次產業→官方類別 majority-mapping門檻
    output_dir: research/official_sector_grid
  rank_velocity_grid:        # docs/31 §14：提早卡位訊號（未進前5但排名快速爬升）預先登記
    horizons_td: [10, 20, 40]    # 沿用panel既有alpha10/20/40欄，零新計算，同§13.1
    top_n_groups: 5               # 與production一致，不重新調參
    min_purity: 0.5                # 與§12/§13.3上線設定一致，不重新調參
    fast_quantile: 0.9            # 逐日橫斷面90分位＝快速爬升門檻（§14.1，避免look-ahead）
    lag_snapshots: 2              # rank_velocity回看快照數（≈2週）
    snapshot_gap_td: 5
    n_boot: 1000
    n_splits: 4                    # 多段walk-forward，同§13.1
    min_train_frac: 0.4
    output_dir: research/rank_velocity_grid
  flow_trigger_grid:         # docs/31 §17：提早卡位訊號v2（★投信流校準預測未進前5族群）
    horizons_td: [10, 20, 40]    # 沿用panel既有alpha10/20/40欄，零新計算
    top_n_groups: 5               # 與production一致，不重新調參
    min_purity: 0.5                # 與§12/§13.3/§14上線設定一致，不重新調參
    lookback_window: 15           # 觸發後幾個交易日內算「近期觸發」＝production的lead_window
    short_window: 5                # compute_fund_flows短窗，同production entry_signal
    long_window: 20                # compute_fund_flows長窗，同production entry_signal
    z_window: 60                    # standardize_signals滾動z視窗，同production
    z_min_periods: 30               # z暖機最低樣本，同production
    signal_col: trust_flow_20d      # 沿用production rotation.entry_signal校準值，不重新調參
    threshold: 1.0                  # 同上
    require_momentum: true          # 同上
    snapshot_gap_td: 5
    n_boot: 1000
    n_splits: 4
    min_train_frac: 0.4
    output_dir: research/flow_trigger_grid
  redesign_dimension_grid:   # docs/31 §22.5/§22.7/§22.10：panel-only候選排列組合研究
    horizons_td: [10, 20, 40]    # 沿用panel既有alpha10/20/40欄，同§13.1起慣例
    top_quantile: 0.2             # §22.3.2統一20%規則，非official_sector_top5的固定top5
    hand_min_purity: 0.5          # 與§12/§13.3/§14/§17上線設定一致，不重新調參（維度1/2用）
    snapshot_gap_td: 5
    n_boot: 1000
    n_splits: 4                    # 第4段(最近)＝§22.5核准的保留驗證窗，不用於搜尋
    min_train_frac: 0.4
    margin:                        # §22.10維度4(融資水位，個股層級)專屬參數
      chg_window_td: 5               # 5交易日%變化窗，同專案margin_chg_5d/washout慣例
      min_prev_lots: 50.0            # 分母防雜訊門檻(張)，避免近0水位%變化雜訊主導排名
    output_dir: research/redesign_dimension_grid
  contrarian_efficacy:       # M-BR1 Phase 2 底部左側聯合桶檢驗（make contrarian-efficacy）
    horizons_td: [5, 10, 20, 40] # forward alpha 窗（交易日）
    focal_horizon: 20            # 焦點窗（§4 ground-truth 用 r+20；裁決以此窗）
    n_splits: 5                  # walk-forward 段數（§1「≥4/5 同號」）
    min_train_frac: 0.4
    wf_min_frac: 0.8             # walk-forward 同號門檻比例（4/5=0.8）
    weekly_snapshot: true        # 週快照抽樣（同 WS-C/WS-D，降前瞻窗重疊）
    n_boot: 1000
    output_dir: research/contrarian_efficacy
  macro_regime_validate:     # docs/25 §6 Phase 2/3（M-Macro2/M-Macro3）as-of 回放驗證＋門檻敏感度
                              # ＋DEXJPUS tail-event 重測（Phase 2）＋燈號vs V2 regime共振/背離讀法驗證（Phase 3）
                              # 讀 research/macro_regime_screening/raw/（三輪研究產出，gitignored，先跑過三輪研究才有這批 parquet）
    raw_dir: research/macro_regime_screening/raw
    event_target: NASDAQCOM.parquet    # 沿用 round1 Pass 1 事件目標（唯一有數十年歷史的權益指數，見 docs/25 §6 Phase 2）
    event_n_days: 60            # headline 格＝N=60（熊市級，對齊 round1/2 report）
    event_drawdown_pct: 0.15    # X=15%
    primary_series_file: BAA10Y.parquet
    lookback_days: 756          # 對齊 macro_regime.lookback_days（production 同一口徑）
    min_obs: 30
    quintile: 0.80               # headline 高風險門檻（對齊 red_min=80 → level_pct≥0.80）
    threshold_grid: [0.75, 0.80, 0.85]  # 門檻敏感度：red_min 75/80/85 對應的 quintile
    dexjpus_file: DEXJPUS.parquet
    dexjpus_delta_days: 20       # 對齊 macro_regime.delta_days
    dexjpus_tail_grid: [0.80, 0.90, 0.95, 0.98]  # round1 quintile(0.80)＋更窄尾端門檻（top 10%/5%/2%）
    tw_index_file: tw_equal_weight_index.parquet  # Phase 3 事件目標（round1 已建的台股等權指數，非 NASDAQCOM——
                                  # 共振讀法測的是台股表現，改用台股自己的指數才對得上問題本身）
    block_len: 60                # CI block bootstrap 區塊長度（對齊 headline N=60）
    n_boot: 1000
    seed: 42
    output_dir: research/macro_regime_screening
  macro_grid_search:         # docs/31 §23.4 Part 4（2026-08-25，執行前寫死）：宏觀指標視窗/
                              # 門檻/組合grid search，對3個已知事件測早期反應（backlog研究，
                              # 頂多產出候選假說清單，不可升級為決策依據，見§23.3/§23.4尾段）
    raw_dir: research/macro_regime_screening/raw
    indicator_files:           # 4指標raw parquet檔名（欄位皆為 date,value）
      BAA10Y: BAA10Y.parquet
      VIXCLS: VIXCLS.parquet
      DGS20: DGS20.parquet
      STLFSI4: STLFSI4.parquet
    calendar_file: BAA10Y.parquet  # 統一交易日曆基準（§23.4：4指標日曆非100%相同但足夠接近）
    analysis_start: "2019-01-01"   # 涵蓋756交易日lookback在2022-01-05錨點前的warmup需求
    analysis_end: "2026-07-31"
    lookback_grid: [252, 504, 756]
    delta_grid: [10, 20, 40]       # speed_pct專用
    threshold_grid: [0.80, 0.90, 0.95]
    min_obs: 30
    gap_td: 10                     # episode合併：中斷≤此交易日數仍算同一段
    min_lead_td: 5                 # 命中視窗下界（太近＝來不及交易）
    max_lead_td: 60                # 命中視窗上界（太遠＝背景雜訊）
    fp_before_td: 60               # false positive排除窗：事件前
    fp_after_td: 20                # false positive排除窗：事件後（給事件本身滯後確認留餘裕）
    fire_rate_ceiling: 0.20        # 候選天花板①（未校準、低信心，見§23.4）
    false_positive_ceiling: 5      # 候選天花板②（未校準、低信心，見§23.4）
    events:                        # 錨點取自docs/25 Phase4已記錄事實/公開常識日期（§23.4表格）
      - name: "2022空頭"
        anchors: ["2022-01-05", "2022-04-25"]
      - name: "2024-08-05崩盤"
        anchors: ["2024-08-05"]
      - name: "2025-04關稅衝擊"
        anchors: ["2025-02-25", "2025-04-07"]
    combo_fixed_config:            # 多指標組合固定用production/Phase5同款單指標設定（§23.4，
                                    # 避免組合層再挑一次最佳單指標參數造成二次挑選）
      BAA10Y: {transform: level_pct, lookback_days: 756, threshold: 0.80}
      VIXCLS: {transform: speed_pct, lookback_days: 756, delta_days: 20, threshold: 0.80}
      DGS20: {transform: level_pct, lookback_days: 756, threshold: 0.80}
      STLFSI4: {transform: level_pct, lookback_days: 756, threshold: 0.80}
    output_dir: research/macro_regime_screening/round6_grid
  flow_inflection:           # WS-E 資金流 inflection 因子族（make flow-inflection）
    horizons_td: [10, 20]        # 評估窗（交易日）
    n_splits: 4
    min_train_frac: 0.4
    buckets: 5
    z_window: 60                 # z-of-z 的滾動 z 窗（同 rotation z_window）
    min_effect_ic: 0.03          # 效應量底線（未校準啟發式；n 數萬時防大樣本假顯著）
    output_dir: research/flow_inflection
  diagnostic:                # M-Diag1「抓太晚」診斷（make diagnose）：候選宇宙延伸度曲線＋排序訊號 IC
    history_days: 250            # 載入日線快取的回看交易日數
    horizons_td: [5, 10, 20]    # 前瞻窗（交易日；須可被 trading_days_per_week 整除）
    trading_days_per_week: 5
    clip_daily_return_pct: 10.0  # 大盤等權指數日報酬夾限（複用 V1 機制）
    target: excess_return_pct    # IC/曲線的 target（excess_return_pct 或 return_pct）
    ext_gate_pct: 15.0           # 現行 F2 距季線硬擋門檻（曲線用來對照實證轉負點）
    min_sample_warn: 20          # 桶樣本低於 3×此 → 標「薄」
    output_dir: research/diagnostic
    missed_launch:             # WS2 漏抓目錄（A 純無偏路；daily_all 全市場乾淨底料 ≤06-09）
      grid: [[10, 20], [10, 15], [5, 15]]  # [forward_td, launch_pct]：敏感度格
      primary: [10, 15]         # 主設定（具名漏抓清單用；10 日漲 15%＝穩健起漲、名單較厚）
      pullback_max_pct: 0.0     # 回檔判定：data_date 近 10 日報酬 ≤ 此（回檔中）
      ma_dist_ceiling_pct: 10.0 # 未延伸判定：距 MA60 ≤ 此（剔高位小回的延伸股）
      min_amount_m: 100.0       # never_surfaced 依當日成交額 ≥ 此(百萬)拆 liquid/illiquid

regime:                        # 規劃書 03 V2 大盤 regime 總控閘門（market regime）
                               # 用等權全市場指數＋全市場法人快取算 趨勢/廣度/資金 三分項，
                               # 合成連續分數→進攻/中性/防禦。定位＝輔助姿態揭露，不硬性 gate 訊號。
  history_days: 250            # 載入日線/法人歷史天數（≈ 1 年，需覆蓋最長 MA120）
  clip_daily_return_pct: 10.0  # 等權指數日報酬夾限＝台股漲跌停，防未還原事件毒化指數
  trend:                       # 趨勢分項：等權指數 vs 多條均線多空排列
    ma_windows: [20, 60, 120]  # 由短到長；多頭排列＝指數 > MA20 > MA60 > MA120
  breadth:                     # 廣度分項：個股位階廣度＋指數距低位階
    ma_window: 60              # 個股站上自身此均線的比例（位階廣度）
    position_window: 120       # 指數距自身此窗高低點的位階（距低=弱、距高=強）
    min_priced: 200            # 當日有效報價個股數低於此 → 廣度視為不可信（回 null）
  flow:                        # 資金分項：全市場三大法人淨流方向
    windows: [5, 20]           # 各窗取近 N 交易日 total_net 全市場日均淨流（股）判方向
    saturate_shares: 800000000 # 日均淨流飽和股數（≈8 億股）：|日均| 達此 → 分項封頂 ±1
                               # 依實測全市場日均淨流量級設（短窗激烈週才封頂、長窗保留漸層）；
                               # 為正規化常數非門檻，每季隨資料校準（類同 rotation 門檻）
  weights:                     # 三分項合成權重（自動正規化為和=1）
    trend: 0.4
    breadth: 0.3
    flow: 0.3
  thresholds:                  # 連續分數 regime_score ∈ [-1, 1] 切三態
    attack: 0.33               # ≥ 此值＝進攻
    defense: -0.33             # ≤ 此值＝防禦；之間＝中性

inflection:                    # 委託書 M4 主排序去落後化：轉折早段描述欄＋候選源 E「轉折埋伏」
                               # 全部**純揭露非 gate**（沿 F5／M-WS5a／M-BR1 pattern）：
                               # 不改排序、不改剔除、不自動進 picks；清單只 surfacing 給人逐檔過。
  margin_slim_flat_pct: -1.0   # M4.1 融資減肥：融資近5日減 ∧ 近5日漲幅 ≥ 此%（「平或漲」的容忍下界）
  ambush_near_low_pct: 10.0    # M4.2 位階：距 60 日低 ≤ 此% 算貼底（比 M1 左側的 ≤5% 寬——候選源非進場資格）
  ambush_inflection_days: [1, 5]  # M4.2 外資尾端連買天數區間（數字大＝已買一段＝尾段，正是要避開的）
  ambush_foreign_20d_small_positive_lots: 5000  # M4.2 20 日外資 ≤ 此張數（「≤0 或小正」的小正上界）
  # M4.2 位階的第二條分支開關。⚠️ 本 repo 的 base_zone="貼底" ＝**距季線 MA60 ≤ +10%**
  # （propicks_flags.base_zone_ma60_max_pct，docs/20 §WS5-①），量的是「未延伸／回到季線
  # base」，**不是「貼近 60 日低點」**——2026-W32 實跑中 7610 距季線 +4.2%（貼底）但距
  # 60 日低 +133.6%。委託書 M4.2 原式把兩者以「或」並聯，故照實作、不自行收緊；清單以
  # `位階依據` 欄攤開兩型並讓距低型排前。若判定只要距低型，改 false 即可（不刪碼）。
  ambush_allow_base_zone_branch: true
  ambush_near_miss_md_limit: 15  # 「只差一條」段在 md 最多列幾檔（完整名單落 *_near_miss.csv）

deep_value:                    # 委託書 M5 估值成長進攻化：deep_value_growth 描述 tag
                               # 要修的病＝現制把估值/成長只當排雷不當進攻，「PE 5–8 倍＋YoY
                               # 三位數＋貼低」在現制下累積最多**排除**旗標，等於系統性丟掉最
                               # 便宜的成長股。本 tag 把該組合正面標出來。
                               # **純揭露非 gate**：不改排序/剔除/picks；命中者進機會層評估段
                               # 逐檔過（可判不進，不許不看）。⚠️ 未經前瞻檢驗。
  max_val_pctile: 20.0         # 次產業內估值升冪百分位 ≤ 此（0＝同業最便宜；PE 主、PB 補虧損股）
  min_rev_yoy_pct: 30.0        # 月營收 YoY ≥ 此（確實在成長，排除衰退股的低估值陷阱）
  min_gross_margin_pct: 25.0   # 毛利率 ≥ 此（有定價權；薄毛利的便宜只是薄毛利，非機會）
                               # 缺值一律不命中（毛利率覆蓋約 9 成、金融業無此欄＝誠實 null）

macro_risk:                    # 委託書 M8 宏觀窄橋（裁決 D）：消費每日美股風險掃描的機器摘要
                               # **只影響倉位節奏（姿態降級／新倉上限），不影響選股**（不改排序/剔除/燈色）。
                               # 檔案由人工從掃描 project（M9）貼進輸入包，缺席合法；三態容錯見 docs/27 §2。
  filename: macro_risk_latest.yaml  # 放在 reports/<週次>/ 下（週報輸入包的一員）
  stale_trading_days: 5        # 掃描日落後超過此平日數 → stale、降級為註記不當 gate（委託書 M8）
  gate_min_hits: 3             # triggers_hit ≥ 此 → 姿態降一級、新倉封 new_position_cap（patch-6）
  new_position_cap: "1/3"      # 觸發時的新倉上限（與事件閘門的 ⅓ 同語意，兩者同時成立取更嚴）
  min_coverage: 5              # **已求值**項數低於此時，「0–2 觸發」的註記必須帶 coverage 警語
                               # （docs/26 §2「分母不完整」圍欄：未求值只會少算，不可讀成風險已清）

washout:                       # 委託書 M2 投降洗盤偵測（market_washout）——**反向 flag**、獨立於 regime
                               # 不進 regime_score、不改燈色、不改排序（併進線性加權會與 regime 互相抵銷）。
                               # ⚠️ 門檻**未校準**：歷史只有一次 530 億級投降樣本（2026-07-30），
                               #    這批是先驗值。依 M2.2，上線前 4 週只描述、不判勝負；調門檻走本檔 diff。
  min_hits: 2                  # ≥ 此數量子項同時成立 → 觸發（共 4 子項；分母只算 status=ok 者）
  descriptive_weeks: 4         # 前 N 週僅描述、報表印「未校準」警語（M2.2 括號要求）
  margin:                      # 子項1 融資投降。**張數口徑、僅上市**——新聞的「530億」是金額，不同口徑
    z_threshold: -2.0          # 單日/5日減幅 z 取較極端者 < 此 → 命中
    lookback_days: 250         # 算 z 的回看列數（＝可得交易日數）
    min_samples: 60            # 變化量有效樣本低於此 → 該窗不評（不用薄樣本算 z）
    window_5d_max_calendar_days: 9  # 尾端 5 列橫跨超過此日曆天＝快取有缺日 → 5 日窗誠實棄用
  breadth:                     # 子項2 廣度 washout（重用 regime 廣度依據的 frac_above_ma，不重算）
    max_frac_above_ma: 0.20    # 全宇宙站上 MA60 比率低於此 → 命中
  flow:                        # 子項3 資金分項極端持續（讀 make regime-history 的 as-of 逐日產物）
    max_flow_score: -0.9       # regime 資金子分低於此＝極端
    min_weeks: 3               # 且**尾端連續**達此週數（中間任一日回到門檻上即中斷）
    trading_days_per_week: 5
  index:                       # 子項4 指數深負乖離。**等權指數**（口徑同 regime），非加權 TAIEX
    ma_window: 60
    max_dist_pct: -7.0         # 距自身 MA60 深於此 → 命中
    min_priced: 200            # 當日有報價個股數低於此＝薄快取日，不進指數（對齊 regime.breadth.min_priced）
                               # 實測 2026-07-27~30 每天只有 10 檔快取，不濾會造出 −20% 級假乖離
  history_path: data/washout/washout_history.parquet  # flag 落檔（同日冪等），供未來回測驗證偵測本身

macro_regime:                  # docs/25 v2 總經避險層（M-Macro1）：單一主訊號＋揭露面板，不合成
                               # BAA10Y 三輪 block-bootstrap 篩選為唯一穩健指標（headline lift
                               # 2.26〔1.61–3.06〕），單獨決定燈色；其餘指標降級揭露不計分。
  primary_series: BAA10Y       # 唯一計分序列（Moody's Baa 公司債對 10 年公債利差）
  primary_transform: level_pct # 三輪研究裡 BAA10Y 最強的轉換（headline ci_lo 1.606 > speed 1.085）
  disclosure_series:            # 揭露面板：不計分，只顯示脈絡（docs/25 §2.2）
    DGS20: level_pct
    VIXCLS: speed_pct
    DCOILWTICO: dual_risk
    STLFSI4: level_pct
    DGS10: raw                 # 未通過驗證，僅揭露原始值
    DEXTAUS: raw               # v1 誤植 DEXTAIUS，正確代碼 DEXTAUS（已用 curl 驗證）
    DEXJPUS: raw               # 無證據，可能是 2024/08 單一事件敘事，非普遍規律
  lookback_days: 756           # ≈3 年觀測數，水位/變速百分位窗（causal，不看未來）
  delta_days: 20               # 變速分量的變化窗（speed_pct／dual_risk 用）
  stale_days: 10               # 主訊號最後觀測日距今 > 此 → 燈號降級「資料不足」
  thresholds:                   # risk_score = level_pct×100 ∈ [0,100]；門檻未校準先驗
    green_max: 60               # < 60 綠
    red_min: 80                 # ≥ 80 紅（對應三輪研究實際檢驗過的「前20分位=高風險」）
  hysteresis: 3                 # 換色需突破門檻 ±3 分（黃→紅需≥83，紅→黃需<77），防閃爍
  panel_history_path: data/macro_regime/panel_history.parquet   # docs/26 A案：面板逐指標歷史
                               # （long format，刻意與 history.parquet 分檔——後者有三個既有讀者，
                               #  加寬 schema 會擴大迴歸面；long format 對 disclosure_series 增減免疫）
  delta_arrow_deadband_pct: 2.0  # score_pct（百分位點）變化 < 此 → 箭頭「→」持平，防微幅雜訊亂標
  delta_arrow_deadband_rel: 0.005  # raw 揭露序列（DGS10/DEX*）相對變化 < 此 → 箭頭「→」
                               # 兩個 deadband 皆為未校準先驗，純顯示用、不進任何計分或門檻判定
  fetch:
    base_url: "https://api.stlouisfed.org/fred/series/observations"
    user_agent: "tw-stock-screener/0.1"
    request_interval_sec: 1     # 序列間隔 ≥1 秒（鐵律1精神外推）
    cache_ttl_hours: 24
    max_retries: 2              # 連錯 3 次（含首次）停
    timeout_sec: 30

tw_valuation_history:          # docs/25 §2.4 fallback B 前置：全市場估值中位數逐日累積
                               # （只做累積、不做驗證/計分——BWIBBU_d 不可回補，須等資料自然養夠）
  history_path: data/macro_regime/tw_valuation_history.parquet  # 刻意在 data/cache/ 之外，
                               # 不受 cache.retention.valuation_days 清理（見模組 docstring）
  validation_target_trading_days: 750  # ≈3 年交易日，對齊 macro_regime.lookback_days=756 同規格門檻

portfolio:                     # 規劃書 03 V3 組合層風控（portfolio check）
                               # 對持股（holdings_enriched，可選併入候選）算 標籤集中度／
                               # 近 N 日報酬相關簇／預定義因子簇曝險。定位＝風險揭露，非硬約束
                               # （holdings 無部位大小欄→所有「合計%」皆為等權檔數佔比近似）。
  history_days: 90             # 載入日線天數（需 ≥ corr.window + 緩衝供算日報酬）
  corr:                        # 報酬相關簇：找彼此高度共動的持股（隱性集中）
    window: 60                 # 近 N 交易日「日報酬」算 Pearson 相關（規劃書 §V3）
    min_overlap: 40            # 兩股重疊有效交易日 < 此 → 該對相關不可信、跳過
    threshold: 0.7            # |ρ| ≥ 此 → 高相關對；高相關對連通成簇（union-find）
    clip_daily_return_pct: 10.0 # 日報酬夾限＝台股漲跌停，防未還原事件毒化相關
  label_concentration:        # 次產業/主題標籤集中度（多標籤：一檔可計入多個標籤）
    min_count: 3              # 同一標籤 ≥ 此檔數 → 列為集中（揭露）
    min_share: 0.4           # 或同一標籤佔組合檔數比例 ≥ 此 → 集中
  factor_clusters:            # 預定義因子簇：吃 industry＋theme 多標籤，任一命中即歸屬該簇。
                              # 簇定義＝交易紀律（docs/11:202 利率敏感簇），可調、不寫死數字在程式
    - name: 利率敏感
      labels: [銀行, 建材營造, 產險, 壽險]  # 同一總經/利率事件（如 PCE）會一次打到的共動鏈
      max_count: 2           # 同簇至多 N 檔（超過＝集中警示）
      max_share: 0.5         # 同簇合計佔組合檔數比例上限（無部位大小→等權近似）
  etf_exposure:               # ETF 手標曝險（docs/21 §3.2）：labels 併入該檔標籤集合，
                              # 參與 集中度/因子簇；手標估計非資料源，換持股請自行維護。
                              # 半導體用「半導體業」與 TWSE industry 字串一致 → 計數自動合併。
    "0050":   {labels: [半導體業, 台股大盤β], note: 台積電權重過半}
    "00981A": {labels: [半導體業, 台股大盤β], note: 主動台股成長；持股依公開月報估計}
    "00988A": {labels: [全球科技, 美元資產], note: 主動全球創新；海外持倉}
    "00687B": {labels: [美債長天期, 美元資產], note: 20年期美國公債；利率久期部位}
