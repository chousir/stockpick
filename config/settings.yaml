paths:
  data_dir: data
  cache_dir: data/cache
  raw_dir: data/raw
  reports_dir: reports
  logs_dir: logs
  watchlist_dir: watchlist
  strategies_dir: config/strategies

goodinfo:
  base_url: "https://goodinfo.tw/tw"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  request_interval_sec: 3
  request_interval_jitter_sec: 1
  cache_refresh_hour: 15   # 盤後資料穩定時點；同一交易日重複跑讀快取，跨交易日才重抓
  max_retries: 3
  backoff_base: 5
  referer: "https://goodinfo.tw/tw/index.asp"
  concurrency: 1

# Yahoo 股市「概念股」主題成分（多標籤主題用）；只抓概念股，電子次產業沿用手標 concepts.yaml
yahoo:
  base_url: "https://tw.stock.yahoo.com"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  request_interval_sec: 3
  request_interval_jitter_sec: 1
  cache_ttl_hours: 24      # 概念股成分鮮少變，同日重跑讀快取
  max_retries: 3
  backoff_base: 5
  concurrency: 1

# candidates_enriched.csv 的 flags 排雷門檻（程式預算，供 ProPicks 快速排雷；皆為「軟警示」非硬刪）
propicks_flags:
  overheated_ma60_pct: 40      # 距季線 > 此% → 過熱（追高風險）
  low_liquidity_amount: 100    # 成交額(百萬) < 此值 → 低流動（大資金滑價）
  high_pe: 50                  # 本益比 > 此值 → 高PE（題材/估值偏貴）
  cross_trade_lots: 5000       # 外資、投信反向且兩者皆 > 此張數 → 土洋對作
  strong_rally_pct: 15         # 5日漲幅 > 此% 且法人淨賣 → 強漲法人賣（假突破警訊）

themes_build:
  category_labels: ["概念股"]   # 只抓概念股；集團股 / 電子產業不抓
  concept_min_members: 3        # 概念股清單較鬆，保留門檻拉高防雜訊
  min_members: 2                # 次產業（手標）排名保留門檻
  # 只爬/只寫白名單裡的概念股題材（留空＝全部 101 個）；只會抓這幾頁、又快又乾淨。
  # 名稱須與 Yahoo 完全一致；全部可選名單見 docs/02-data-sources.md。自由增刪。
  concept_whitelist:
    - "衛星/低軌衛星"
    - "5G"
    - "AI人工智慧"
    - "雲伺服器"
    - "電動車/油電車"
    - "ADAS"
    - "車聯網"
    - "功率半導體"
    - "矽智財(IP)"
    - "Mini LED"
    - "無線充電"
    - "半導體設備"
    - "機器人/智慧機械"
    - "風力發電/離岸風電"
    - "國防自主"

twse:
  base_url: "https://openapi.twse.com.tw/v1"
  user_agent: "tw-stock-screener/0.1"
  request_interval_sec: 1
  cache_ttl_hours: 6

# TPEX（櫃買中心）上櫃股 OHLCV 來源，僅作說明用途
# 目前 TWSEClient 透過 _load_otc_ids() 自動分派；TPEX 與 TWSE 共用 _get_legacy 的 throttle
# 設定值寫在這裡是為了文件清楚，未來若分 client 再生效
tpex:
  base_url: "https://www.tpex.org.tw"
  stock_day_path: "/www/zh-tw/afterTrading/tradingStock"
  notes: "單位仟股 / 仟元（parser 自動 ×1000 對齊 TWSE）"

report:
  default_top_n: 10

group_analysis:
  weights:
    momentum: 0.50      # 5 日累計漲幅（sigmoid 校準），動能主導
    entry_rate: 0.25    # 族群入選率
    institutional: 0.15 # 法人買超家數比（族群內 inst_net>0 家數 / 成員數，已啟用）
    size: 0.10          # 族群規模（log 正規化）
  min_group_size: 2
  top_groups: 10
  top_stocks: 10
  dividend_lookahead_days: 14   # 除權息前瞻窗（日曆日，約 10 交易日）
  macro_lookahead_days: 30      # 總經事件前瞻窗（日曆日，涵蓋雙雷／法說／結算）
  vol_lookback_days: 20         # 量比均量視窗（交易日）；每檔只取今日前最近 N 天平均，與輸入列數脫鉤

# 策略 G（成長拉回）的拉回 setup 門檻；G 有效命中 = 基本面命中 ∧ 三者全中
g_pullback:
  ma60_band_low: -5.0        # 乖離帶下界（% 距季線；允許略破季線）
  ma60_band_high: 10.0       # 乖離帶上界（超過＝仍延伸、不算回踩）
  ma60_slope_window: 10      # 季線斜率比較視窗（交易日）
  ma60_slope_min_pct: 0.0    # 季線上揚最低斜率（%）；> 此值才算上揚
  vol_ratio_max: 1.0         # 量縮門檻（今日量 / 20 日均量 ≤ 此值）
